services:
  # ==========================================
  # 1. HOST DE JOGO 01 (KasmVNC / Desktop Isolado)
  # ==========================================
  host01-game:
    image: docker.io/kasmweb/core-debian-trixie:1.18.0
    container_name: host01_game
    restart: unless-stopped
    privileged: true
    ipc: host
    shm_size: '2gb'
    environment:
      - TZ=America/Sao_Paulo
      - VNC_PW=password
    volumes:
      - './installers:/installers:ro'
      - '/run/media/rodrigo/97b9b0d6-284b-4b3a-93e6-f47230b40360/Games:/games:ro'
    ports:
      - "6901:6901"

